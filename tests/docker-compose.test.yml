# The integration tests' stack: docker-compose.yml's ClickHouse with a fake key, the test functions, and the mock
# Drex API in ClickHouse's network, so the functions reach it at http://127.0.0.1:8787. From the repository root:
#
#   python3 tests/clickhouse_functions.py tests/.generated/drex_test_function.xml
#   docker compose -f docker-compose.yml -f tests/docker-compose.test.yml up -d --build --wait
#   DREX_CLICKHOUSE_URL=http://127.0.0.1:8123 DREX_MOCK_URL=http://127.0.0.1:8787 python3 -m pytest
services:
  clickhouse:
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./tests/secrets/nace_api_key:/etc/clickhouse-server/drex/nace_api_key:ro
      - ./tests/.generated/drex_test_function.xml:/etc/clickhouse-server/drex_test_function.xml:ro

  mock:
    image: python:3.12-slim
    network_mode: "service:clickhouse"
    volumes:
      - ./tests/mock:/mock:ro
    command: ["python3", "/mock/drex_mock.py", "--host", "0.0.0.0", "--port", "8787"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/__health')"]
      interval: 2s
      timeout: 5s
      retries: 30
