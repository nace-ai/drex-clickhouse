# Development settings only: the UDF is a single script (udf/drex_udf.py) with its runtime dependency in
# udf/requirements.txt, not a package.

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tests/mock"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["clickhouse: needs the ClickHouse server from docker-compose.yml (DREX_CLICKHOUSE_URL)"]
